<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f9"/>
      <stop offset="100%" stop-color="#e1ebf0"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3498db" />
    </marker>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGradient)"/>

  <text x="400" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">Mechanism of Labor</text>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">The 7 Cardinal Movements of the Fetus</text>

  <line x1="400" y1="110" x2="400" y2="920" stroke="#3498db" stroke-width="4" stroke-dasharray="8,8" marker-end="url(#arrow)"/>

  <line x1="400" y1="160" x2="430" y2="160" stroke="#3498db" stroke-width="3"/>
  <rect x="430" y="115" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="430" cy="160" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  
  <text x="465" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Engagement</text>
  <text x="465" y="168" font-family="Arial, sans-serif" font-size="13" fill="#555555">The fetal presenting part enters the</text>
  <text x="465" y="186" font-family="Arial, sans-serif" font-size="13" fill="#555555">pelvic inlet (reaches zero station).</text>

  <line x1="400" y1="280" x2="370" y2="280" stroke="#3498db" stroke-width="3"/>
  <rect x="80" y="235" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="370" cy="280" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="370" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <text x="335" y="265" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="end">Descent</text>
  <text x="335" y="288" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="end">Continuous downward movement</text>
  <text x="335" y="306" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="end">deep into the pelvic cavity.</text>

  <line x1="400" y1="400" x2="430" y2="400" stroke="#3498db" stroke-width="3"/>
  <rect x="430" y="355" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="430" cy="400" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="406" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <text x="465" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Flexion</text>
  <text x="465" y="408" font-family="Arial, sans-serif" font-size="13" fill="#555555">The baby's chin tucks to its chest,</text>
  <text x="465" y="426" font-family="Arial, sans-serif" font-size="13" fill="#555555">presenting the smallest head diameter.</text>

  <line x1="400" y1="520" x2="370" y2="520" stroke="#3498db" stroke-width="3"/>
  <rect x="80" y="475" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="370" cy="520" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="370" y="526" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

  <text x="335" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="end">Internal Rotation</text>
  <text x="335" y="528" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="end">The fetal head rotates to align the face</text>
  <text x="335" y="546" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="end">with the mother's anteroposterior axis.</text>

  <line x1="400" y1="640" x2="430" y2="640" stroke="#3498db" stroke-width="3"/>
  <rect x="430" y="595" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="430" cy="640" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="646" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <text x="465" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Extension</text>
  <text x="465" y="648" font-family="Arial, sans-serif" font-size="13" fill="#555555">The head pivots under the pubic bone</text>
  <text x="465" y="666" font-family="Arial, sans-serif" font-size="13" fill="#555555">and extends to emerge from the vagina.</text>

  <line x1="400" y1="760" x2="370" y2="760" stroke="#3498db" stroke-width="3"/>
  <rect x="80" y="715" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="370" cy="760" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="370" y="766" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

  <text x="335" y="745" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="end">External Rotation</text>
  <text x="335" y="768" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="end">The head turns to the side to naturally</text>
  <text x="335" y="786" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="end">realign with the baby's shoulders.</text>

  <line x1="400" y1="880" x2="430" y2="880" stroke="#3498db" stroke-width="3"/>
  <rect x="430" y="835" width="290" height="90" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="430" cy="880" r="22" fill="#2980b9" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="886" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>

  <text x="465" y="865" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Expulsion</text>
  <text x="465" y="888" font-family="Arial, sans-serif" font-size="13" fill="#555555">The anterior shoulder delivers first,</text>
  <text x="465" y="906" font-family="Arial, sans-serif" font-size="13" fill="#555555">followed by the rest of the body.</text>

</svg>
