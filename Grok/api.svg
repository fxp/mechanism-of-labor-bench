<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <linearGradient id="pelvisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d5d5"/>
      <stop offset="100%" stop-color="#f4a3a3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c5aa0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#fdfaf5"/>

  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Mechanism of Labor (Cardinal Movements)</text>

  <!-- Stage labels -->
  <!-- 1. Engagement -->
  <g>
    <!-- Pelvis outline (simplified inlet) -->
    <ellipse cx="150" cy="180" rx="70" ry="45" fill="none" stroke="#c46d6d" stroke-width="12"/>
    <ellipse cx="150" cy="180" rx="55" ry="32" fill="none" stroke="#f8d5d5" stroke-width="6"/>
    
    <!-- Fetal head (occiput anterior, unflexed) -->
    <ellipse cx="150" cy="155" rx="28" ry="22" fill="#ffe4c4" stroke="#8b5a2b" stroke-width="3"/>
    <circle cx="138" cy="148" r="3" fill="#333"/> <!-- anterior fontanelle hint -->
    
    <!-- Arrow showing engagement -->
    <path d="M150 115 L150 135" fill="none" stroke="#2c5aa0" stroke-width="3" marker-end="url(#arrow)"/>
    
    <text x="150" y="270" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">1. Engagement</text>
    <text x="150" y="288" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Head enters pelvic inlet</text>
  </g>

  <!-- 2. Descent + Flexion -->
  <g>
    <ellipse cx="320" cy="195" rx="62" ry="38" fill="none" stroke="#c46d6d" stroke-width="12"/>
    <ellipse cx="320" cy="195" rx="48" ry="26" fill="none" stroke="#f8d5d5" stroke-width="6"/>
    
    <!-- Flexed head (smaller diameter) -->
    <ellipse cx="320" cy="185" rx="24" ry="28" fill="#ffe4c4" stroke="#8b5a2b" stroke-width="3" transform="rotate(-15 320 185)"/>
    
    <path d="M320 140 L320 165" fill="none" stroke="#2c5aa0" stroke-width="3" marker-end="url(#arrow)"/>
    
    <text x="320" y="270" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">2. Descent &amp; Flexion</text>
    <text x="320" y="288" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Head flexes, chin to chest</text>
  </g>

  <!-- 3. Internal Rotation -->
  <g>
    <ellipse cx="490" cy="210" rx="55" ry="35" fill="none" stroke="#c46d6d" stroke-width="12"/>
    <ellipse cx="490" cy="210" rx="42" ry="24" fill="none" stroke="#f8d5d5" stroke-width="6"/>
    
    <!-- Head rotated 45° (occiput anterior) -->
    <ellipse cx="490" cy="205" rx="20" ry="26" fill="#ffe4c4" stroke="#8b5a2b" stroke-width="3" transform="rotate(45 490 205)"/>
    
    <text x="490" y="270" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">3. Internal Rotation</text>
    <text x="490" y="288" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Head rotates to fit midpelvis</text>
  </g>

  <!-- 4. Extension -->
  <g>
    <ellipse cx="660" cy="225" rx="50" ry="32" fill="none" stroke="#c46d6d" stroke-width="12"/>
    <ellipse cx="660" cy="225" rx="38" ry="22" fill="none" stroke="#f8d5d5" stroke-width="6"/>
    
    <!-- Head extending at outlet -->
    <ellipse cx="660" cy="225" rx="22" ry="24" fill="#ffe4c4" stroke="#8b5a2b" stroke-width="3" transform="rotate(-30 660 225)"/>
    
    <path d="M635 210 L645 225" fill="none" stroke="#c46d6d" stroke-width="2"/>
    
    <text x="660" y="270" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">4. Extension</text>
    <text x="660" y="288" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Head extends under pubic arch</text>
  </g>

  <!-- 5. External Rotation / Restitution -->
  <g>
    <ellipse cx="820" cy="245" rx="45" ry="30" fill="none" stroke="#c46d6d" stroke-width="12"/>
    <ellipse cx="820" cy="245" rx="34" ry="20" fill="none" stroke="#f8d5d5" stroke-width="6"/>
    
    <!-- Head after restitution (shoulders rotate) -->
    <ellipse cx="820" cy="248" rx="18" ry="23" fill="#ffe4c4" stroke="#8b5a2b" stroke-width="3" transform="rotate(15 820 248)"/>
    
    <text x="820" y="290" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">5. External Rotation</text>
    <text x="820" y="308" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Head rotates back (restitution)</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="340" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">Followed by: Expulsion of shoulders &amp; trunk</text>
  
  <!-- Direction legend -->
  <g>
    <rect x="80" y="370" width="740" height="220" rx="12" fill="#f9f3ec" stroke="#e0c9b0" stroke-width="2"/>
    <text x="450" y="400" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#5c4033">Key Movements Summary</text>
    
    <line x1="120" y1="430" x2="180" y2="430" stroke="#2c5aa0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="200" y="435" font-family="Arial" font-size="11" fill="#333">Descent</text>
    
    <rect x="380" y="420" width="30" height="20" rx="4" fill="#ffe4c4" stroke="#8b5a2b" stroke-width="2"/>
    <text x="425" y="435" font-family="Arial" font-size="11" fill="#333">Flexion</text>
    
    <path d="M550 425 Q590 425 590 445" fill="none" stroke="#2c5aa0" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="610" y="435" font-family="Arial" font-size="11" fill="#333">Rotation</text>
    
    <path d="M120 470 L180 490" fill="none" stroke="#b35959" stroke-width="3"/>
    <text x="200" y="490" font-family="Arial" font-size="11" fill="#333">Extension at outlet</text>
    
    <text x="450" y="530" font-family="Arial" font-size="11" text-anchor="middle" fill="#5c4033" font-style="italic">All movements occur due to pelvic shape &amp; uterine contractions</text>
  </g>
</svg>