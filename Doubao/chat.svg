<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  <text x="400" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Mechanism of Labor - Normal Vaginal Delivery Process</text>

  <!-- Step 1: Engagement -->
  <g transform="translate(80,100)">
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#e8f4f8" stroke="#3498db"/>
    <text x="70" y="25" text-anchor="middle" font-size="14" font-weight="bold">1. Engagement</text>
    <!-- Pelvis -->
    <path d="M30 60 Q70 40 110 60 L100 140 Q70 160 40 140 Z" fill="#d5eaf5" stroke="#2980b9" stroke-width="2"/>
    <!-- Fetal head -->
    <circle cx="70" cy="90" r="25" fill="#fadbd8" stroke="#e74c3c"/>
    <text x="70" y="170" text-anchor="middle" font-size="11">Head enters pelvic inlet</text>
  </g>

  <!-- Step 2: Descent & Flexion -->
  <g transform="translate(220,100)">
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#f0f8e8" stroke="#27ae60"/>
    <text x="70" y="25" text-anchor="middle" font-size="14" font-weight="bold">2. Descent+Flexion</text>
    <path d="M30 60 Q70 40 110 60 L100 140 Q70 160 40 140 Z" fill="#dcf2e2" stroke="#229954" stroke-width="2"/>
    <ellipse cx="70" cy="110" rx="22" ry="28" fill="#fadbd8" stroke="#e67e22"/>
    <text x="70" y="170" text-anchor="middle" font-size="11">Head descends, chin flexed</text>
  </g>

  <!-- Step 3: Internal Rotation -->
  <g transform="translate(360,100)">
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#fff3e8" stroke="#f39c12"/>
    <text x="70" y="25" text-anchor="middle" font-size="14" font-weight="bold">3. Internal Rotation</text>
    <path d="M30 60 Q70 40 110 60 L100 140 Q70 160 40 140 Z" fill="#ffe8cc" stroke="#d35400" stroke-width="2"/>
    <ellipse cx="70" cy="120" rx="20" ry="26" fill="#fadbd8" stroke="#c0392b" transform="rotate(15 70 120)"/>
    <text x="70" y="170" text-anchor="middle" font-size="11">Head rotates to match pelvis</text>
  </g>

  <!-- Step 4: Extension -->
  <g transform="translate(500,100)">
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#f3e8fc" stroke="#9b59b6"/>
    <text x="70" y="25" text-anchor="middle" font-size="14" font-weight="bold">4. Extension</text>
    <path d="M30 60 Q70 40 110 60 L100 140 Q70 160 40 140 Z" fill="#e8d9f5" stroke="#8e44ad" stroke-width="2"/>
    <ellipse cx="70" cy="130" rx="18" ry="24" fill="#fadbd8" stroke="#8e44ad" transform="rotate(-20 70 130)"/>
    <text x="70" y="170" text-anchor="middle" font-size="11">Head extends to deliver</text>
  </g>

  <!-- Step 5: Restitution & External Rotation -->
  <g transform="translate(150,320)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#eafaf1" stroke="#16a085"/>
    <text x="110" y="28" text-anchor="middle" font-size="14" font-weight="bold">5. Restitution & External Rotation</text>
    <circle cx="70" cy="75" r="22" fill="#fadbd8" stroke="#1abc9c"/>
    <path d="M92 75 L130 95" stroke="#16a085" stroke-width="3"/>
    <text x="110" y="115" text-anchor="middle" font-size="11">Fetal body aligns after head delivery</text>
  </g>

  <!-- Step 6: Expulsion -->
  <g transform="translate(430,320)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#fef2f2" stroke="#e11d48"/>
    <text x="110" y="28" text-anchor="middle" font-size="14" font-weight="bold">6. Expulsion of Fetus & Placenta</text>
    <ellipse cx="70" cy="70" rx="30" ry="20" fill="#fecdd3" stroke="#f43f5e"/>
    <text x="110" y="115" text-anchor="middle" font-size="11">Full fetus & placenta delivered</text>
  </g>

  <!-- Arrow connect -->
  <path d="M150 190 L220 190" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 190 L500 190" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M290 280 L260 320" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 280 L660 320" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>