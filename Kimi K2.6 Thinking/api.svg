<svg id="main-svg" viewBox="0 0 600 600" class="w-full h-full max-w-[800px] max-h-[800px] z-0">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
                    </marker>
                </defs>

                <!-- Pelvis Structure (Static) -->
                <g id="pelvis-group" transform="translate(300, 300)">
                    <!-- Sacrum & Promontory -->
                    <path d="M -60 -120 Q -40 -80 0 -80 Q 40 -80 80 -100" class="bone-structure" stroke="#f87171"/>
                    <!-- Pelvic Inlet (Brim) -->
                    <path d="M -80 -100 Q 0 -120 80 -100 Q 90 0 80 120 Q 0 160 -80 120 Q -90 0 -80 -100" 
                          class="bone-structure" opacity="0.3" /> <!-- Inlet outline -->
                    
                    <!-- Ischial Spines (Crucial Landmark) -->
                    <circle cx="-45" cy="0" r="3" fill="#38bdf8" opacity="0.8"/>
                    <circle cx="45" cy="0" r="3" fill="#38bdf8" opacity="0.8"/>

                    <!-- Pelvic Outlet -->
                    <path d="M -90 140 Q 0 180 90 140" class="bone-structure" stroke="#475569" stroke-dasharray="4 2"/>
                    
                    <!-- Symphysis Pubis -->
                    <path d="M -20 120 L -15 160 L 15 160 L 20 120" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/>
                    
                    <!-- Pelvic Cavity Area (Background) -->
                    <path d="M -80 -100 Q -90 0 -80 120 L -20 120 L 20 120 L 80 120 Q 90 0 80 -100 Q 0 -120 -80 -100 Z" 
                          fill="#1e293b" opacity="0.5" stroke="none"/>
                </g>

                <!-- Fetal Head Group -->
                <g id="fetal-head-group" transform="translate(300, 200)">
                    <!-- Occiput (Back of head) - Pointed down initially -->
                    <g id="head-rotation-wrapper">
                        <!-- Head Shape -->
                        <ellipse cx="0" cy="0" rx="45" ry="55" class="fetal-skin" />
                        <!-- Fontanelles/Bones detail -->
                        <path d="M -20 -20 L 0 -10 L 20 -20" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
                        <path d="M 0 -10 L 0 30" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
                        
                        <!-- Face/Anterior Indicator (The Pink Part) -->
                        <!-- We draw a segment to show where the face is -->
                        <path d="M 0 0 m -42,0 a 42,55 0 0,0 84,0" fill="#fecaca" opacity="0.4" class="fetal-face-highlight"/>
                        <text x="0" y="25" text-anchor="middle" font-size="10" fill="#9f1239" font-weight="bold" class="opacity-75">FACE</text>
                        
                        <!-- Occiput Marker -->
                        <circle cx="0" cy="-40" r="3" fill="#334155" />
                        <text x="0" y="-45" text-anchor="middle" font-size="8" fill="#334155" font-weight="bold">OCCIPUT</text>
                    </g>
                </g>

                <!-- Directional Arrows (Dynamic) -->
                <g id="force-vectors" opacity="0" transform="translate(300, 300)">
                    <!-- Extension/Descent Arrow -->
                    <line x1="0" y1="-50" x2="0" y2="20" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>
                    <text x="10" y="-10" fill="#a855f7" font-size="12" font-weight="bold">Descent</text>
                </g>

                <!-- Measurement Lines -->
                <g id="measurements" opacity="0.5" transform="translate(300, 300)">
                     <!-- Station Line -->
                     <line x1="120" y1="-120" x2="120" y2="0" stroke="#cbd5e1" stroke-dasharray="2 2"/>
                     <text x="125" y="-60" fill="#cbd5e1" font-size="10">Ischial Spine (0 Station)</text>
                </g>
            </svg>