<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <style>
    .bone-structure {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fetal-skin {
      fill: #94a3b8;
      stroke: #475569;
      stroke-width: 1;
    }
    .fetal-face-highlight {
      fill: #fecaca;
    }
  </style>

  <!-- Background -->
  <rect width="600" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">Mechanism of Labor — Engagement (Step 1 / 7)</text>
  <text x="300" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Vertex presentation · Left Occiput Anterior (LOA)</text>

  <!-- Pelvis Structure -->
  <g id="pelvis-group" transform="translate(300, 320)">
    <!-- Sacrum & Promontory -->
    <path d="M -60 -120 Q -40 -80 0 -80 Q 40 -80 80 -100" class="bone-structure" stroke="#f87171"/>
    <text x="85" y="-95" font-family="Arial,sans-serif" font-size="9" fill="#f87171">Sacrum &amp; Promontory</text>

    <!-- Pelvic Inlet (Brim) -->
    <path d="M -80 -100 Q 0 -120 80 -100 Q 90 0 80 120 Q 0 160 -80 120 Q -90 0 -80 -100"
          class="bone-structure" stroke="#64748b" stroke-dasharray="6 3" opacity="0.6"/>

    <!-- Pelvic Inlet label -->
    <text x="-5" y="-108" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Pelvic Inlet</text>

    <!-- Ischial Spines -->
    <circle cx="-45" cy="0" r="4" fill="#38bdf8" opacity="0.9"/>
    <circle cx="45" cy="0" r="4" fill="#38bdf8" opacity="0.9"/>
    <text x="-50" y="-6" text-anchor="end" font-family="Arial,sans-serif" font-size="8" fill="#38bdf8">Ischial Spine</text>
    <text x="50" y="-6" text-anchor="start" font-family="Arial,sans-serif" font-size="8" fill="#38bdf8">Ischial Spine</text>

    <!-- Pelvic Outlet -->
    <path d="M -90 140 Q 0 180 90 140" class="bone-structure" stroke="#475569" stroke-dasharray="4 2"/>
    <text x="0" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748b">Pelvic Outlet</text>

    <!-- Symphysis Pubis -->
    <path d="M -20 120 L -15 160 L 15 160 L 20 120" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="-25" y="148" text-anchor="end" font-family="Arial,sans-serif" font-size="8" fill="#94a3b8">Symphysis Pubis</text>

    <!-- Pelvic Cavity shading -->
    <path d="M -80 -100 Q -90 0 -80 120 L -20 120 L 20 120 L 80 120 Q 90 0 80 -100 Q 0 -120 -80 -100 Z"
          fill="#1e293b" opacity="0.6" stroke="none"/>

    <!-- Station measurement line -->
    <line x1="-100" y1="0" x2="-50" y2="0" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1" opacity="0.5"/>
    <text x="-105" y="3" text-anchor="end" font-family="Arial,sans-serif" font-size="8" fill="#cbd5e1" opacity="0.7">0 Station</text>
  </g>

  <!-- Fetal Head — at engagement (entering inlet, head at top of pelvis) -->
  <g id="fetal-head-group" transform="translate(300, 215)">
    <!-- Head outline -->
    <ellipse cx="0" cy="0" rx="45" ry="55" class="fetal-skin"/>

    <!-- Coronal / sagittal suture lines -->
    <path d="M -20 -20 L 0 -10 L 20 -20" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 -10 L 0 30" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

    <!-- Anterior fontanelle diamond -->
    <path d="M 0 -10 L 8 -18 L 0 -26 L -8 -18 Z" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>

    <!-- Face / anterior half highlight -->
    <path d="M -42 0 a 42,55 0 0,0 84,0" class="fetal-face-highlight" opacity="0.35"/>
    <text x="0" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#9f1239" opacity="0.85">FACE</text>

    <!-- Occiput marker -->
    <circle cx="0" cy="-45" r="4" fill="#38bdf8"/>
    <text x="0" y="-52" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#38bdf8" font-weight="bold">OCCIPUT</text>
  </g>

  <!-- Descent arrow (now visible) -->
  <g id="force-vectors" transform="translate(300, 320)">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0,0 L0,8 L8,4 z" fill="#a855f7"/>
      </marker>
    </defs>
    <line x1="0" y1="-180" x2="0" y2="-100" stroke="#a855f7" stroke-width="2.5"
          marker-end="url(#arr)" stroke-dasharray="5 3"/>
    <text x="8" y="-145" font-family="Arial,sans-serif" font-size="11" fill="#a855f7" font-weight="bold">Descent</text>
  </g>

  <!-- Legend -->
  <g transform="translate(18, 420)">
    <text font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" y="0">LEGEND</text>
    <circle cx="6" cy="14" r="4" fill="#38bdf8"/>
    <text x="14" y="18" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Ischial Spines (0 Station)</text>
    <rect x="2" y="26" width="8" height="5" fill="#cbd5e1"/>
    <text x="14" y="33" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Symphysis Pubis</text>
    <line x1="2" y1="44" x2="10" y2="44" stroke="#f87171" stroke-width="2"/>
    <text x="14" y="48" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Sacrum</text>
    <ellipse cx="6" cy="60" rx="5" ry="6" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <text x="14" y="63" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Fetal Head</text>
    <circle cx="6" cy="74" r="3" fill="#38bdf8"/>
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Occiput</text>
    <path d="M2,88 l8,0" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="14" y="92" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8">Descent force</text>
  </g>

  <!-- Note explaining this is step 1 of interactive app -->
  <text x="300" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#475569">
    Original: interactive 7-step HTML app · This SVG shows Step 1 (Engagement) as a static anatomical reference
  </text>
</svg>
